{{ define "main" }}
<article class="section-article">
  {{ partial "page-heading.html" . }}
  <div class="prose">{{ .Content }}</div>
  {{ if not .Params.noCards }}<div class="section-grid">{{ range .Pages.ByWeight }}<a href="{{ .RelPermalink }}" class="section-entry"><span class="entry-arrow" aria-hidden="true">↗</span><h2>{{ .LinkTitle }}</h2>{{ with .Description }}<p>{{ . }}</p>{{ end }}{{ with .Params.operationCount }}<span class="entry-meta">{{ . }} operations</span>{{ end }}</a>{{ end }}</div>{{ end }}
</article>
{{ end }}
