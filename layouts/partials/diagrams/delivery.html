<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-labelledby="delivery-title delivery-description">
<title id="delivery-title">Message delivery and durable native receipt</title><desc id="delivery-description">Matrix event acquisition checks authority and wake policy, preserves provenance and uses inline input or complete private files. The adapter records the exact pending input, submits it to the exact native history, proves a matching native user entry, then commits the listener cursor and acknowledges the receipt. Unknown earlier delivery is preserved, not treated as success.</desc>
<rect class="box" x="15" y="20" width="180" height="75" rx="8"/><text x="105" y="47" text-anchor="middle">Matrix events</text><text class="subtext" x="105" y="71" text-anchor="middle">opaque per-room cursor</text>
<rect class="box" x="245" y="20" width="260" height="75" rx="8"/><text x="375" y="47" text-anchor="middle">Authority + wake check</text><text class="subtext" x="375" y="71" text-anchor="middle">provenance / directory / exact context</text>
<rect class="box" x="555" y="20" width="250" height="75" rx="8"/><text x="680" y="47" text-anchor="middle">Complete native input</text><text class="subtext" x="680" y="71" text-anchor="middle">inline or private files + manifest</text>
<path class="connector" d="M195 57H245M505 57H555M680 95V159M555 197H505M245 197H195"/>
<rect class="box primary-box" x="555" y="159" width="250" height="75" rx="8"/><text x="680" y="187" text-anchor="middle">Runtime adapter</text><text class="subtext" x="680" y="211" text-anchor="middle">persist exact input → native submit</text>
<rect class="box primary-box" x="245" y="159" width="260" height="75" rx="8"/><text x="375" y="187" text-anchor="middle">Native user entry</text><text class="subtext" x="375" y="211" text-anchor="middle">only the matching entry proves receipt</text>
<rect class="box" x="15" y="159" width="180" height="75" rx="8"/><text x="105" y="187" text-anchor="middle">Listener commit</text><text class="subtext" x="105" y="211" text-anchor="middle">cursor + exact acknowledgment</text>
<rect class="box" x="15" y="265" width="790" height="55" rx="7"/><text class="subtext" x="410" y="288" text-anchor="middle">A mention can interrupt the exact live turn before submission. It never grants authority.</text><text class="subtext" x="410" y="307" text-anchor="middle">Unknown delivery after restart stays explicit. External effects cannot be exactly-once certified.</text>
</svg>
