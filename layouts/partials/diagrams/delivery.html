<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-labelledby="delivery-title delivery-description">
<title id="delivery-title">Message delivery</title><desc id="delivery-description">The listener reads Matrix events, checks room and wake permissions, and prepares input or private files. The runtime adapter saves and sends the input. After finding a matching native user entry, the listener saves its unread position. Unconfirmed input is retained for recovery.</desc>
<rect class="box" x="15" y="20" width="180" height="75" rx="8"/><text x="105" y="47" text-anchor="middle">Matrix events</text><text class="subtext" x="105" y="71" text-anchor="middle">Unread cursor per room</text>
<rect class="box" x="245" y="20" width="260" height="75" rx="8"/><text x="375" y="47" text-anchor="middle">Permission and wake check</text><text class="subtext" x="375" y="71" text-anchor="middle">Sender, room and selected history</text>
<rect class="box" x="555" y="20" width="250" height="75" rx="8"/><text x="680" y="47" text-anchor="middle">Prepare input</text><text class="subtext" x="680" y="71" text-anchor="middle">Inline text or private files</text>
<path class="connector" d="M195 57H245M505 57H555M680 95V159M555 197H505M245 197H195"/>
<rect class="box primary-box" x="555" y="159" width="250" height="75" rx="8"/><text x="680" y="187" text-anchor="middle">Runtime adapter</text><text class="subtext" x="680" y="211" text-anchor="middle">Save and send input</text>
<rect class="box primary-box" x="245" y="159" width="260" height="75" rx="8"/><text x="375" y="187" text-anchor="middle">Native user entry</text><text class="subtext" x="375" y="211" text-anchor="middle">Match the delivered input</text>
<rect class="box" x="15" y="159" width="180" height="75" rx="8"/><text x="105" y="187" text-anchor="middle">Save unread position</text><text class="subtext" x="105" y="211" text-anchor="middle">Acknowledge confirmed delivery</text>
<rect class="box" x="15" y="265" width="790" height="55" rx="7"/><text class="subtext" x="410" y="288" text-anchor="middle">An accepted mention interrupts the running turn before sending the new message.</text><text class="subtext" x="410" y="307" text-anchor="middle">After a restart, unconfirmed earlier delivery is reported as unknown, not success.</text>
</svg>
