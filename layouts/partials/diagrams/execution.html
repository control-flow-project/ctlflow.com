<title id="execution-title">Server and controller connections</title><desc id="execution-description">Humans use Element and the management UI. crossfire owns server authorization, its SQLite database and Matrix integration. On the user's host, fleet talks to fleetd over a private Unix socket or SSH. fleetd talks to Matrix/crossfire by HTTP and owns Codex or Pi processes and private histories.</desc>
