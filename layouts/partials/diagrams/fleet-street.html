<svg viewBox="0 0 760 380" role="img" aria-labelledby="fleet-street-diagram-title fleet-street-diagram-description">
  <title id="fleet-street-diagram-title">A theatre brief and its specialist review</title>
  <desc id="fleet-street-diagram-description">A person asks in a Matrix room. The stage manager assigns a budget analyst, asks the fact-checker for independent review and returns a synthesis to that room. The other seven specialists are consulted only when needed.</desc>
  <path class="connector" d="M380 72v36M270 160l-100 48M490 160l100 48M260 254h240M590 208V143H510"/>
  <rect class="box" x="260" y="20" width="240" height="52" rx="8"/><text x="380" y="51" text-anchor="middle">Human request in a room</text>
  <rect class="box primary-box" x="250" y="108" width="260" height="67" rx="8"/><text x="380" y="137" text-anchor="middle">stage-manager</text><text class="subtext" x="380" y="158" text-anchor="middle">Scope, assign and synthesize</text>
  <rect class="box" x="40" y="208" width="240" height="89" rx="8"/><text x="160" y="239" text-anchor="middle">budget-analyst</text><text class="subtext" x="160" y="263" text-anchor="middle">Calculate supplied inputs</text><text class="subtext" x="160" y="282" text-anchor="middle">No live prices assumed</text>
  <rect class="box" x="480" y="208" width="240" height="89" rx="8"/><text x="600" y="239" text-anchor="middle">fact-checker</text><text class="subtext" x="600" y="263" text-anchor="middle">Independent review</text><text class="subtext" x="600" y="282" text-anchor="middle">Keep unknowns visible</text>
  <text class="subtext" x="380" y="330" text-anchor="middle">Only needed agents receive room access and assignments.</text>
  <text class="subtext" x="380" y="354" text-anchor="middle">The stage manager replies through the tool to the original room.</text>
</svg>
